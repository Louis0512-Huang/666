<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝陽科技大學 VR 校園導覽</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #1a73e8;
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            display: flex;
            max-width: 1000px;
            width: 90%;
            background: white;
            margin: 30px auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        /* 左側圖片展示區 */
        .image-section {
            flex: 2;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .image-section img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            object-fit: contain;
        }
        /* 右側介紹與導覽按鈕區 */
        .content-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }
        .info-box h2 {
            margin-top: 0;
            color: #1a73e8;
            font-size: 22px;
        }
        .info-box p {
            color: #555;
            line-height: 1.6;
            font-size: 15px;
        }
        /* 導覽按鈕群組 */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-btn {
            padding: 12px 16px;
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #dadce0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background-color: #e8f0fe;
            border-color: #1a73e8;
            color: #1a73e8;
        }
        .nav-btn.active {
            background-color: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
    </style>
</head>
<body>

    <header>🏫 朝陽科技大學 校園導覽系統</header>

    <div class="container">
        <!-- 圖片顯示區 -->
        <div class="image-section">
            <img id="spot-img" src="" alt="校園景點照片">
        </div>

        <!-- 介紹與按鈕區 -->
        <div class="content-section">
            <div class="info-box">
                <h2 id="spot-title">載入中...</h2>
                <p id="spot-desc">請稍候，正在載入景點資訊...</p>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn active" onclick="switchSpot('admin')">🏛️ 行政大樓</button>
                <button class="nav-btn" onclick="switchSpot('library')">📚 資訊圖書館</button>
                <button class="nav-btn" onclick="switchSpot('airplan')">✈️ 航空大樓</button>
                <button class="nav-btn" onclick="switchSpot('playground')">⚽ 綜合運動場</button>
                <button class="nav-btn" onclick="switchSpot('dormitory')">🛏️ 學生宿舍環境</button>
            </div>
        </div>
    </div>

    <script>
        // 景點資料庫（統一設定檔名與文字內容）
        const spots = {
            "admin": {
                "title": "行政大樓",
                "desc": "朝陽科大的行政核心與地標建築。歐風典雅的鐘樓造型與紅磚廣場相輝映，辦理各項教務、學務與行政業務的主要場所。",
                "img": "administration.jpg"
            },
            "library": {
                "title": "波錠紀念圖書館",
                "desc": "藏書豐富的智慧型圖書館，提供舒適的閱讀自修空間、多媒體視聽室以及各類學術資源，是學生課業研討的最佳去處。",
                "img": "library.jpg"
            },
            "airplan": {
                "title": "時選航空大樓（飛機修護實作停機庫）",
                "desc": "全台少見擁有真實客機機鼻與航空實作設備的特色大樓，結合 RICH 創業基地，培育頂尖航空與工程技術人才。",
                "img": "airplan.jpg"
            },
            "playground": {
                "title": "綜合大運動場",
                "desc": "包含標準紅土跑道、大型草皮足球場及周邊戶外球場，提供全校師生強身健體、舉辦運動會及課外社團活動的重要場域。",
                "img": "playground.jpg"
            },
            "dormitory": {
                "title": "學生宿舍大樓",
                "desc": "內部設施完善的學生宿舍，採用上床下桌設計，提供舒適、安全且生活機能便利的住宿環境，營造溫馨的住宿生活圈。",
                "img": "dormitory.jpg"
            }
        };

        // 切換景點函式
        function switchSpot(spotKey) {
            const data = spots[spotKey];
            if (!data) return;

            // 更新文字
            document.getElementById('spot-title').innerText = data.title;
            document.getElementById('spot-desc').innerText = data.desc;
            
            // 更新圖片
            const imgElement = document.getElementById('spot-img');
            imgElement.src = data.img;
            imgElement.onerror = function() {
                this.src = "";
                alert("找不到圖片檔案：" + data.img + "。\n請確認該圖片已正確上傳至 GitHub，且檔名與程式碼相符！");
            };

            // 更新按鈕高亮狀態
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event && event.target.classList.add('active');
        }

        // 預設進入網頁時顯示行政大樓
        window.onload = function() {
            switchSpot('admin');
        };
    </script>

</body>
</html>
