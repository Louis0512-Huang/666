<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝陽科大 VR 校園導覽</title>
    <!-- 引入 Pannellum VR 全景套件 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
        }
        /* 浮動式互動校園地圖 */
        #map-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 260px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }
        #map-container h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #333;
        }
        /* 地圖圖片樣式 */
        .interactive-map {
            width: 100%;
            height: auto;
            border-radius: 6px;
            cursor: pointer;
        }
        /* 標題列 */
        #title-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            z-index: 1000;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="title-bar">🏫 互動式 VR 校園導覽系統</div>
    
    <!-- 360 全景容器 -->
    <div id="panorama"></div>

    <!-- 右下角互動校園地圖 -->
    <div id="map-container">
        <h4>📍 點擊地圖切換場景</h4>
        <!-- 引入你的校園平面圖，檔名已設為 map.jpg -->
        <img src="map.jpg" alt="校園地圖" class="interactive-map" usemap="#campus-map">
        
        <!-- 定義地圖可點擊的座標區域 (shape="rect" 為矩形：x1, y1, x2, y2) -->
        <map name="campus-map">
            <!-- 點擊圖書館區域 -->
            <area shape="rect" coords="190,280,240,350" href="javascript:void(0);" onclick="switchScene('library')" alt="圖書館" title="點擊前往：圖書館">
            
            <!-- 點擊行政大樓區域 -->
            <area shape="rect" coords="120,200,180,270" href="javascript:void(0);" onclick="switchScene('admin')" alt="行政大樓" title="點擊前往：行政大樓">
            
            <!-- 點擊運動場區域 -->
            <area shape="rect" coords="40,80,120,160" href="javascript:void(0);" onclick="switchScene('stadium')" alt="運動場" title="點擊前往：運動場">
            
            <!-- 點擊宿舍大樓區域 -->
            <area shape="rect" coords="120,20,180,80" href="javascript:void(0);" onclick="switchScene('dorm')" alt="宿舍大樓" title="點擊前往：宿舍大樓">
        </map>
    </div>

    <!-- 引入 Pannellum JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        // 初始化 VR 全景場景
        let viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "admin",
                "author": "校園導覽專案團隊",
                "sceneFadeDuration": 1000,
                "autoLoad": true
            },
            "scenes": {
                "admin": {
                    "title": "行政大樓 / 紅磚廣場",
                    "hfov": 110,
                    "pitch": 0,
                    "yaw": 0,
                    "type": "equirectangular",
                    "panorama": "https://pannellum.org/images/alma.jpg"
                },
                "library": {
                    "title": "圖書館",
                    "hfov": 110,
                    "pitch": 0,
                    "yaw": 180,
                    "type": "equirectangular",
                    "panorama": "https://pannellum.org/images/bma-1.jpg"
                },
                "stadium": {
                    "title": "運動場與體育館",
                    "hfov": 110,
                    "pitch": 0,
                    "yaw": 90,
                    "type": "equirectangular",
                    "panorama": "https://pannellum.org/images/cerulean-tower.jpg"
                },
                "dorm": {
                    "title": "宿舍大樓",
                    "hfov": 110,
                    "pitch": 0,
                    "yaw": 0,
                    "type": "equirectangular",
                    "panorama": "https://pannellum.org/images/alma.jpg"
                }
            }
        });

        // 點擊地圖區塊切換 VR 場景
        function switchScene(sceneId) {
            viewer.loadScene(sceneId);
        }
    </script>

</body>
</html>
